<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio personal de Andres Sebastian Soto Astete para Programación Web II">
    <title>Portafolio personal | Programacion Web II</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <header class="header">
        <nav class="header__nav">
            <ul class="header__menu">
                <li><a class="header__menu__link" href="about.html">Sobre mí</a></li>
                <li><button id="theme-toggle" class="theme-toggle">🌙</button></li>
            </ul>
        </nav>
    </header>
    
    <main class="presentacion">
        <section class="presentacion__contenido">
            <h1 class="presentacion__titulo">
                Programación Web II
                <strong class="titulo-destaque">con GitHub</strong>
            </h1>
            <p class="presentacion__texto">¡Hola! Esta sera mi primera página en Programacion Web II y a continuacion estaran mis redes sociales si quieres seguirme.</p>
            
            <div class="presentacion__redes">
                <h2 class="presentacion__subtitulo">Accede a mis redes</h2>
                <ul class="presentacion__enlaces">
                    <li>
                        <a class="presentacion__enlace" href="https://github.com/sebastiansoto1407/web2" target="_blank" rel="noopener noreferrer">
                            <img src="assets/github.png" alt="Logo GitHub" width="24" height="24">
                            GitHub
                        </a>
                    </li>
                    <li>
                        <a class="presentacion__enlace" href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                            <img src="instagram.png" alt="Logo Instagram" width="24" height="24">
                            Instagram
                        </a>
                    </li>
                    <li>
                        <a class="presentacion__enlace" href="https://www.facebook.com/share/19yBLkRs1F/?mibextid=LQQJ4d" target="_blank" rel="noopener noreferrer">
                            <img src="facebook.png" alt="Logo Facebook" width="24" height="24">
                            Facebook
                        </a>
                    </li>
                </ul>
            </div>

            <div class="contacto">
                <h2 class="contacto__titulo">Contactame</h2>
                <form id="contact-form" class="contacto__form">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar</button>
                </form>
                <div id="form-message" class="form-message"></div>
            </div>
        </section>
        
        <div class="presentacion__imagen">
            <img src="assets/web-development.png" alt="Ilustración de desarrollo web" width="400" height="400" id="main-image">
        </div>
    </main>

    <button id="back-to-top" class="back-to-top" title="Volver arriba">↑</button>
    
    <footer class="footer">
        <p class="footer__texto">Desarrollado por Andres Sebastian Soto Astete &copy; <span id="year"></span></p>
        <p class="visitas">Visitas: <span id="visit-counter">0</span></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const yearElement = document.getElementById('year');
    yearElement.textContent = new Date().getFullYear();
    const visitCounter = document.getElementById('visit-counter');
    let visits = localStorage.getItem('pageVisits');
    
    if (visits) {
        visits = parseInt(visits) + 1;
    } else {
        visits = 1;
    }
    
    localStorage.setItem('pageVisits', visits);
    visitCounter.textContent = visits;

    const backToTopButton = document.getElementById('back-to-top');
    
    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            backToTopButton.classList.add('visible');
        } else {
            backToTopButton.classList.remove('visible');
        }
    });
    
    backToTopButton.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });

    // cambiamos de tono
    const themeToggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    
    if (currentTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
    }
    
    themeToggle.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        
        const newTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        
        themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // formulario funcional
    const contactForm = document.getElementById('contact-form');
    const formMessage = document.getElementById('form-message');
    
    contactForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const mensaje = document.getElementById('mensaje').value;
        setTimeout(() => {
            formMessage.textContent = `gracias loco ${nombre}, tu mensaje ha sido enviado. Te respondere mas tarde al ${email} pronto o no xd.`;
            formMessage.className = 'form-message success';
            contactForm.reset();
            
            // desaparece mensaje
            setTimeout(() => {
                formMessage.style.opacity = '0';
                setTimeout(() => {
                    formMessage.className = 'form-message';
                    formMessage.style.opacity = '1';
                }, 300);
            }, 5000);
        }, 1000);
    });

    // añadimos efecto hover
    const menuLinks = document.querySelectorAll('.header__menu__link');
    
    menuLinks.forEach(link => {
        link.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.05)';
        });
        
        link.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    });

    // animamos foto
    const mainImage = document.getElementById('main-image');
    
    mainImage.addEventListener('load', function() {
        this.style.opacity = '1';
        this.style.transition = 'opacity 1s ease';
    });

    // enlace actibos
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    
    menuLinks.forEach(link => {
        const linkPage = link.getAttribute('href');
        if (currentPage === linkPage) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });
});
        
    </script>
</body>
</html>
