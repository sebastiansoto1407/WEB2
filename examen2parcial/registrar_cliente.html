<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Cliente</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <h1>Registrar Cliente</h1>
  <form id="formCliente">
    <input type="text" id="nombre" placeholder="Nombre" required />
    <input type="email" id="email" placeholder="Correo" required />
    <button type="submit">Registrar</button>
  </form>

  <p id="mensaje"></p>

  <script src="js/cliente-service.js" type="module"></script>
  <script type="module">
    import { clienteService } from "./js/cliente-service.js";

    document.getElementById("formCliente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;

      try {
        await clienteService.crearCliente(nombre, email);
        document.getElementById("mensaje").textContent = "cliente registrado con exito.";
      } catch (error) {
        document.getElementById("mensaje").textContent = "Error al registrar.";
        console.error(error);
      } 
    });
  </script>
</body>
</html>
